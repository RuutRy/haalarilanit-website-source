pre-commit:
  commands:
    # Biome's single gate: format + import order + safe lint fixes, then
    # re-stages whatever it changed. Check-only leftovers fail the commit.
    lint:
      run: pnpm lint:fix
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
